# xdg-desktop-portal backend selection for Hyprland.
# hyprland handles screencopy/screencast/global shortcuts; gtk is the fallback
# for everything else (file chooser, etc.). Mirrors the package's
# /usr/share/xdg-desktop-portal/hyprland-portals.conf so it also works when the
# desktop-specific file is not picked up.
[preferred]
default=hyprland;gtk
