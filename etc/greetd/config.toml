# greetd greeter session — ReGreet must run inside a Wayland compositor.
# Upstream setup (https://github.com/rharish101/ReGreet):
#   cage -s -mlast -d   = enable VT switching (prevents lockout),
#                         show on the last-connected monitor only,
#                         no client-side decorations.
#   dbus-run-session    = a clean D-Bus session (fixes GTK startup delays).
[terminal]
# The VT to run the greeter on.
vt = 1

[default_session]
# ReGreet reads its own settings from /etc/greetd/regreet.toml
command = "dbus-run-session cage -s -mlast -d -- regreet"
user = "greeter"

# Auto-login: start Hyprland directly on boot, skipping the greeter.
# greetd runs this only once per boot (guarded by its runfile in /run), so
# logging out still drops back to ReGreet normally. The XDG_* variables mirror
# the [env] block in regreet.toml so the session is registered as Wayland.
[initial_session]
command = "env XDG_SESSION_TYPE=wayland XDG_CURRENT_DESKTOP=Hyprland XDG_SESSION_DESKTOP=Hyprland start-hyprland"
user = "sveto"
