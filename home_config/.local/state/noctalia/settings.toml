config_version = 14

# Noctalia's GUI-managed state. Seeded only on first install (the installer uses
# rsync --ignore-existing) so re-running never clobbers the user's wallpaper etc.
#
# NOTE: do not ship a [lockscreen_widgets] section here — Noctalia regenerates
# that state itself, and seeding it makes Noctalia append its own copy on the
# next external change, after which the file fails to parse ("cannot redefine
# existing table lockscreen_widgets..."). Let Noctalia own it.
#
# Plugin enablement and plugin_settings live in ~/.config/noctalia/config.toml
# (merged, safe to overwrite), not here.

[shell]
telemetry_enabled = false

[wallpaper]
directory = "__HOME__/.local/share/wallpapers"

    [wallpaper.default]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"

    [wallpaper.last]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"

    [wallpaper.monitors.__OUTPUT__]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"
