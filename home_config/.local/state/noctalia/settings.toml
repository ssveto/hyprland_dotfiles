config_version = 14

# NOTE: do not ship a [lockscreen_widgets] section here. Noctalia regenerates
# that state itself; seeding it makes Noctalia append its own copy on the next
# external change and the file then fails to parse ("cannot redefine existing
# table lockscreen_widgets..."). Let Noctalia own it.

[plugins]
enabled = [ "kenn/keybind-cheatsheet" ]

# Cheatsheet plugin: parse the classic keybinds.conf instead of scanning
# hyprland.lua, whose Lua scan exceeds Noctalia's Luau CPU budget.
[plugin_settings."kenn/keybind-cheatsheet"]
compositor = "hyprland"
hyprland_parser = "conf"
hyprland_config = "__HOME__/.config/hypr/keybinds.conf"

[shell]
telemetry_enabled = false

[wallpaper]
directory = "__HOME__/.local/share/wallpapers"

    [wallpaper.default]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"

    [wallpaper.last]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"

    [wallpaper.monitors.__OUTPUT__]
    path = "__HOME__/.local/share/wallpapers/EndeavourOS_SpaceStation__3840x2160.png"
