id = "local/sway-keybinds"
name = "Sway Keybinds"
version = "0.1.0"
plugin_api = 17
author = "local"
license = "MIT"
icon = "keyboard"
description = "Searchable, palette-themed cheatsheet of your Sway keybindings."
tags = ["sway", "utility", "system"]

[[service]]
id = "data"
entry = "service.luau"

# ---- Plugin-level settings (shared by every entry) ----

[[setting]]
key = "sway_config"
type = "file"
label_key = "settings.sway_config.label"
description_key = "settings.sway_config.description"
default = "~/.config/sway/config"

[[setting]]
key = "group_by_section"
type = "bool"
label_key = "settings.group_by_section.label"
description_key = "settings.group_by_section.description"
default = true

# ---- Entries ----

[[panel]]
id = "cheatsheet"
entry = "panel.luau"
width = 1100
height = 720
placement = "floating"
position = "center"
keyboard_focus = "exclusive"
open_near_click = true

[[widget]]
id = "keybinds"
entry = "widget.luau"

  [[widget.setting]]
  key = "glyph"
  type = "glyph"
  label_key = "settings.glyph.label"
  description_key = "settings.glyph.description"
  default = "keyboard"
