# Keybind reference for the Noctalia "Keybind Cheatsheet" plugin.
#
# The plugin's Hyprland-Lua mode scans hyprland.lua, which currently exceeds
# Noctalia's Luau CPU budget (see the log: service.luau:946 "exceeded its CPU
# budget") and leaves the panel stuck on "Reading keybindings...". This file is
# parsed with the plugin's classic-conf parser instead, so the cheatsheet works.
#
# Keep it in sync with ~/.config/hypr/hyprland.lua. It is documentation only and
# is never loaded by Hyprland itself.

# 1. Basics
bind = SUPER, RETURN, exec, footclient #"Terminal"
bind = SUPER, Q, killactive, #"Close window"
bind = SUPER, W, killactive, #"Close window"
bind = SUPER, D, exec, noctalia msg panel-toggle launcher #"App launcher"
bind = SUPER, SPACE, exec, noctalia msg panel-toggle launcher #"App launcher"
bind = SUPER SHIFT, D, exec, noctalia msg panel-toggle launcher #"App launcher"
bind = SUPER, S, exec, noctalia msg panel-toggle control-center #"Control center"
bind = SUPER, comma, exec, noctalia msg settings-toggle #"Noctalia settings"
bind = SUPER, F1, exec, noctalia msg session lock #"Lock screen"
bind = SUPER SHIFT, E, exec, ~/.config/hypr/scripts/power_menu.sh #"Power menu"
bind = SUPER SHIFT, C, exec, hyprctl reload #"Reload Hyprland"

# 2. Window switcher
bind = SUPER, P, exec, noctalia msg window-switcher #"Window switcher"
bind = ALT, Tab, exec, noctalia msg window-switcher hold #"Window switcher (hold)"

# 3. Windows
bind = SUPER, F, fullscreen, 1 #"Maximize window"
bind = SUPER SHIFT, F, fullscreen, 0 #"Fullscreen window"
bind = SUPER SHIFT, slash, exec, noctalia msg panel-toggle kenn/keybind-cheatsheet:cheatsheet #"Keybind cheatsheet"
bind = SUPER, N, exec, thunar #"File manager"
bind = SUPER, O, exec, firefox #"Web browser"
bind = SUPER CTRL, V, exec, noctalia msg panel-toggle clipboard #"Clipboard history"
bind = SUPER, R, exec, ~/.config/hypr/scripts/fzf-history.sh #"Shell history (fzf)"

# 4. Focus
bind = SUPER, left, movefocus, l #"Focus left"
bind = SUPER, right, movefocus, r #"Focus right"
bind = SUPER, up, movefocus, u #"Focus up"
bind = SUPER, down, movefocus, d #"Focus down"
bind = SUPER, h, movefocus, l #"Focus left"
bind = SUPER, j, movefocus, d #"Focus down"
bind = SUPER, k, movefocus, u #"Focus up"
bind = SUPER, l, movefocus, r #"Focus right"

# 5. Move window
bind = SUPER SHIFT, left, movewindow, l #"Move window left"
bind = SUPER SHIFT, right, movewindow, r #"Move window right"
bind = SUPER SHIFT, up, movewindow, u #"Move window up"
bind = SUPER SHIFT, down, movewindow, d #"Move window down"
bind = SUPER SHIFT, h, movewindow, l #"Move window left"
bind = SUPER SHIFT, j, movewindow, d #"Move window down"
bind = SUPER SHIFT, k, movewindow, u #"Move window up"
bind = SUPER SHIFT, l, movewindow, r #"Move window right"

# 6. Workspaces
bind = SUPER, 1, workspace, 1 #"Focus workspace 1"
bind = SUPER, 2, workspace, 2 #"Focus workspace 2"
bind = SUPER, 3, workspace, 3 #"Focus workspace 3"
bind = SUPER, 4, workspace, 4 #"Focus workspace 4"
bind = SUPER, 5, workspace, 5 #"Focus workspace 5"
bind = SUPER, 6, workspace, 6 #"Focus workspace 6"
bind = SUPER, 7, workspace, 7 #"Focus workspace 7"
bind = SUPER, 8, workspace, 8 #"Focus workspace 8"
bind = SUPER, 9, workspace, 9 #"Focus workspace 9"
bind = SUPER, 0, workspace, 10 #"Focus workspace 10"
bind = SUPER SHIFT, 1, movetoworkspace, 1 #"Move to workspace 1"
bind = SUPER SHIFT, 2, movetoworkspace, 2 #"Move to workspace 2"
bind = SUPER SHIFT, 3, movetoworkspace, 3 #"Move to workspace 3"
bind = SUPER SHIFT, 4, movetoworkspace, 4 #"Move to workspace 4"
bind = SUPER SHIFT, 5, movetoworkspace, 5 #"Move to workspace 5"
bind = SUPER SHIFT, 6, movetoworkspace, 6 #"Move to workspace 6"
bind = SUPER SHIFT, 7, movetoworkspace, 7 #"Move to workspace 7"
bind = SUPER SHIFT, 8, movetoworkspace, 8 #"Move to workspace 8"
bind = SUPER SHIFT, 9, movetoworkspace, 9 #"Move to workspace 9"
bind = SUPER SHIFT, 0, movetoworkspace, 10 #"Move to workspace 10"

# 7. Scratchpad
bind = SUPER SHIFT, minus, movetoworkspacesilent, special:magic #"Move to scratchpad"
bind = SUPER, minus, togglespecialworkspace, magic #"Toggle scratchpad"

# 8. Layout
bind = SUPER, V, togglesplit, #"Toggle split"
bind = SUPER SHIFT, SPACE, togglefloating, #"Toggle floating"
bind = SUPER, G, togglegroup, #"Toggle group (tabbed)"

# 9. Resize
bind = SUPER CTRL, left, resizeactive, -20 0 #"Resize left"
bind = SUPER CTRL, right, resizeactive, 20 0 #"Resize right"
bind = SUPER CTRL, up, resizeactive, 0 -20 #"Resize up"
bind = SUPER CTRL, down, resizeactive, 0 20 #"Resize down"
bind = SUPER CTRL, h, resizeactive, -20 0 #"Resize left"
bind = SUPER CTRL, j, resizeactive, 0 20 #"Resize down"
bind = SUPER CTRL, k, resizeactive, 0 -20 #"Resize up"
bind = SUPER CTRL, l, resizeactive, 20 0 #"Resize right"

# 10. Mouse
bindm = SUPER, mouse:272, movewindow #"Drag window"
bindm = SUPER, mouse:273, resizewindow #"Resize window"
bind = SUPER, mouse_down, workspace, e+1 #"Next workspace"
bind = SUPER, mouse_up, workspace, e-1 #"Previous workspace"

# 11. Media and brightness
bind = , XF86AudioRaiseVolume, exec, noctalia msg volume-up #"Volume up"
bind = , XF86AudioLowerVolume, exec, noctalia msg volume-down #"Volume down"
bind = , XF86AudioMute, exec, noctalia msg volume-mute #"Mute volume"
bind = , XF86AudioMicMute, exec, noctalia msg mic-mute #"Mute microphone"
bind = , XF86MonBrightnessUp, exec, noctalia msg brightness-up #"Brightness up"
bind = , XF86MonBrightnessDown, exec, noctalia msg brightness-down #"Brightness down"
bind = , XF86AudioPlay, exec, playerctl play-pause #"Play / pause"
bind = , XF86AudioPause, exec, playerctl play-pause #"Play / pause"
bind = , XF86AudioNext, exec, playerctl next #"Next track"
bind = , XF86AudioPrev, exec, playerctl previous #"Previous track"

# 12. Screenshots
bind = , Print, exec, grim -g "$(slurp)" - | swappy -f - #"Screenshot region"
bind = CTRL, Print, exec, ~/.config/hypr/scripts/screenshot_window.sh #"Screenshot window"
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot_display.sh #"Screenshot monitor"
