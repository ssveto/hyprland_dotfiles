# Render the active palette into external apps when the theme changes.
[theme.templates]
enable_builtin_templates = true
enable_community_templates = true
# GTK3/GTK4 css import + foot terminal colors follow the palette.
builtin_ids = ["gtk3", "gtk4", "foot"]
# No community templates: the papirus-icons one forces the GTK icon theme back
# to Papirus, overriding the Numix-Circle icon theme set by the installer.
community_ids = []
